name = "korea-early-warning"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 5분마다 감시 사이클 (Workers 무료 플랜: 크론 트리거 5개, 요청 10만/일 이내)
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kew"
database_id = "REPLACE_WITH_D1_ID"   # 배포 워크플로가 자동으로 채움
migrations_dir = "migrations"

[vars]
NTFY_SERVER = "https://ntfy.sh"
DISABLED_SOURCES = ""

# 비밀값은 여기 적지 않는다. GitHub Actions(.github/workflows/deploy.yml)가 GitHub Secrets 에서
# `wrangler secret put` 으로 등록한다: KEW_SECRET(필수), SAFETYDATA_API_KEY, NTFY_TOPIC, NTFY_TOKEN,
# PUSHOVER_TOKEN, PUSHOVER_USER, OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET
