name = "korea-early-warning"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 무료 플랜은 실행 1회당 CPU 10ms 제한 → 소스를 묶음별로 나눠 각각 다른 크론에서 실행
#  - 5분: 재난문자·지진·항공 (빠른 소스)
#  - 15분: 항행경보(응답이 큼)·GDELT(5초당 1회 제한)
#  - 5분(1분 어긋남): 언론 RSS — 공식발표 인용 속보 감지
[triggers]
crons = ["*/5 * * * *", "2-59/15 * * * *", "1-59/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kew"
database_id = "REPLACE_WITH_D1_ID"   # 배포 워크플로가 자동으로 채움
migrations_dir = "migrations"

[vars]
NTFY_SERVER = "https://ntfy.sh"
DISABLED_SOURCES = "opensky"   # Cloudflare 서버에서 응답 없음 → adsb.lol 사용

# 비밀값은 여기 적지 않는다. GitHub Actions(.github/workflows/deploy.yml)가 GitHub Secrets 에서
# `wrangler secret put` 으로 등록한다: KEW_SECRET(필수), SAFETYDATA_API_KEY, NTFY_TOPIC, NTFY_TOKEN,
# PUSHOVER_TOKEN, PUSHOVER_USER, OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET
