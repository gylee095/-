name = "korea-early-warning"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 무료 플랜(크론 5개, 실행당 CPU 10ms)에 맞춰 소스를 5개 묶음으로 나눈다 (src/worker/index.ts CRON_GROUPS 와 일치)
#  - 1분: 연합뉴스 속보 (미사일·포격 최단 경로)
#  - 5분: 재난문자·지진·항공기(민항·군용·정찰기)·교차확인용 언론
#  - 15분: 항행경보·SNS·환율
#  - 1시간: 여행경보·국방부 보도자료·북한 인터넷·AIS·위성 열점
#  - 하루 1회(11:41 KST): GPS 교란 전일 집계·서해 중국 선박(위성 AIS)
# 공개 주소 (2026-11-05 구입, Cloudflare Registrar). workers.dev 도 계속 켜 둔다 — MCP·진행 중 결제 통보·운영자용
workers_dev = true
routes = [
  { pattern = "koreasiren.com", custom_domain = true },
  { pattern = "www.koreasiren.com", custom_domain = true },
]

[triggers]
crons = ["* * * * *", "*/5 * * * *", "3-59/15 * * * *", "11 * * * *", "41 2 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kew"
database_id = "REPLACE_WITH_D1_ID"   # 배포 워크플로가 자동으로 채움
migrations_dir = "migrations"

[vars]
PUBLIC_URL = "https://koreasiren.com"   # 손님 화면·알림 링크·결제 주소 (예전 주소로 온 손님 화면은 여기로 301)
NTFY_SERVER = "https://ntfy.sh"
DISABLED_SOURCES = "opensky,gdelt,bluesky"   # Cloudflare 서버에서 opensky 무응답, gdelt 429, bluesky 403 (2026-10-30 실측)
# 심층 분석(Claude Code 예약 작업 API 트리거) 사용량 안전장치 — 바꾸려면 이 값만 고쳐 다시 배포
DEEP_DAILY_MAX = "2"                 # 하루(한국 날짜) 최대 자동 실행 수
DEEP_MONTHLY_MAX_RUNS = "30"         # 한 달 최대 심층 분석 수 (수동 실행 포함) — 1회 출력 약 3천~9천 토큰(2026-10-31 실측)

# 비밀값은 여기 적지 않는다. GitHub Actions(.github/workflows/deploy.yml)가 GitHub Secrets 에서
# `wrangler secret put` 으로 등록한다: KEW_SECRET(필수), SAFETYDATA_API_KEY, NTFY_TOPIC, NTFY_TOKEN,
# PUSHOVER_TOKEN, PUSHOVER_USER, OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET
